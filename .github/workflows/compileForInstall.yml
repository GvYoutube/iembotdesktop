name: Build and Push Linux Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libgl1 libglib2.0-0 makeself
          
      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests PyQt6

      - name: Build PyInstaller Binary
        run: |
          pyinstaller --noconfirm --onefile --windowed \
            --add-data "src/snd/alert.mp3:src/snd" \
            --add-data "src/icon.png:src" \
            --name "iembot-desktop" \
            src/main.py

      - name: Assemble Package Dir & Install Script
        run: |
          mkdir -p pkg_dir
          
          # Copy the compiled binary and the raw icon image
          cp dist/iembot-desktop pkg_dir/
          # Added due to it saying that it couldn't find the icon in src, despite it's not in src.
          cp /home/runner/work/iembotdesktop/icon.png pkg_dir/iembot-desktop.png

          # Create install script executed by makeself
          cat << 'EOF' > pkg_dir/install.sh
          #!/bin/bash
          echo "Installing IEMBot Desktop..."

          # 1. Install binary globally
          sudo cp iembot-desktop /usr/local/bin/iembot-desktop
          sudo chmod +x /usr/local/bin/iembot-desktop

          # 2. Install icon image globally so desktop launchers can read it
          sudo cp ../icon.png /usr/share/pixmaps/iembot-desktop.png

          # 3. Define the shortcut file contents
          DESKTOP_ENTRY="[Desktop Entry]
          Name=IEMBot Desktop
          Comment=NWS IEMBot Chat Client
          Exec=/usr/local/bin/iembot-desktop
          Icon=/usr/share/pixmaps/iembot-desktop.png
          Terminal=false
          Type=Application
          Categories=Network;Utility;"

          # 4. Install into system application menu
          echo "$DESKTOP_ENTRY" | sudo tee /usr/share/applications/iembot-desktop.desktop > /dev/null

          # 5. Drop shortcut directly onto the active user's Desktop screen (if directory exists)
          USER_DESKTOP=$(xdg-user-dir DESKTOP 2>/dev/null || echo "$HOME/Desktop")

          if [ -d "$USER_DESKTOP" ]; then
              echo "$DESKTOP_ENTRY" > "$USER_DESKTOP/iembot-desktop.desktop"
              chmod +x "$USER_DESKTOP/iembot-desktop.desktop"
              
              # Trust shortcut (required for GNOME/KDE double-click launching)
              gio trust "$USER_DESKTOP/iembot-desktop.desktop" 2>/dev/null || true
              echo "Desktop shortcut created at: $USER_DESKTOP/iembot-desktop.desktop"
          fi

          echo "Installation complete!"
          EOF
          chmod +x pkg_dir/install.sh

      - name: Generate Self-Extracting Installer
        run: |
          makeself pkg_dir iembot-desktop-installer.run "IEMBot Desktop Installer" ./install.sh

      - name: Publish Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: iembot-desktop-installer.run
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
