name: Build Single-File Linux Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies for Qt & Makeself
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libgl1 libglib2.0-0 xdg-utils makeself

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests PyQt6

      - name: Locate Assets and Build PyInstaller Binary
        run: |
          # 1. Dynamically locate icon.png whether it's in root or src/
          if [ -f "src/icon.png" ]; then
            ICON_SRC="src/icon.png"
          elif [ -f "icon.png" ]; then
            ICON_SRC="icon.png"
          else
            echo "ERROR: Could not find icon.png anywhere in the repo!"
            exit 1
          fi

          # 2. Dynamically locate alert.mp3 whether it's in src/snd/ or snd/
          if [ -f "src/snd/alert.mp3" ]; then
            SOUND_SRC="src/snd/alert.mp3"
          elif [ -f "snd/alert.mp3" ]; then
            SOUND_SRC="snd/alert.mp3"
          else
            echo "ERROR: Could not find alert.mp3 anywhere in the repo!"
            exit 1
          fi

          # 3. Locate main.py
          if [ -f "src/main.py" ]; then
            MAIN_SCRIPT="src/main.py"
          else
            MAIN_SCRIPT="main.py"
          fi

          echo "Using Icon: $ICON_SRC"
          echo "Using Sound: $SOUND_SRC"
          echo "Using Script: $MAIN_SCRIPT"

          # 4. Build single-file executable
          pyinstaller --noconfirm --onefile --windowed \
            --add-data "${SOUND_SRC}:snd" \
            --add-data "${ICON_SRC}:." \
            --name "iembot-desktop" \
            "$MAIN_SCRIPT"

          # Store the found icon path for the makeself stage
          echo "FOUND_ICON=$ICON_SRC" >> $GITHUB_ENV

      - name: Assemble Package Directory
        run: |
          mkdir -p pkg_dir
          
          # Copy binary and icon file into staging directory
          cp dist/iembot-desktop pkg_dir/
          cp "$FOUND_ICON" pkg_dir/iembot-desktop.png

          # Write install script executed by makeself upon extraction
          cat << 'EOF' > pkg_dir/install.sh
          #!/bin/bash
          set -e

          echo "Installing IEMBot Desktop..."

          # Install binary globally
          sudo cp iembot-desktop /usr/local/bin/iembot-desktop
          sudo chmod +x /usr/local/bin/iembot-desktop

          # Install icon globally
          sudo cp iembot-desktop.png /usr/share/pixmaps/iembot-desktop.png

          # Construct desktop entry
          DESKTOP_ENTRY="[Desktop Entry]
          Name=IEMBot Desktop
          Comment=NWS IEMBot Chat Client
          Exec=/usr/local/bin/iembot-desktop
          Icon=/usr/share/pixmaps/iembot-desktop.png
          Terminal=false
          Type=Application
          Categories=Network;Utility;"

          # Install to system application menu
          echo "$DESKTOP_ENTRY" | sudo tee /usr/share/applications/iembot-desktop.desktop > /dev/null

          # Drop desktop shortcut on user's Desktop screen if folder exists
          USER_DESKTOP=$(xdg-user-dir DESKTOP 2>/dev/null || echo "$HOME/Desktop")

          if [ -d "$USER_DESKTOP" ]; then
              echo "$DESKTOP_ENTRY" > "$USER_DESKTOP/iembot-desktop.desktop"
              chmod +x "$USER_DESKTOP/iembot-desktop.desktop"
              gio trust "$USER_DESKTOP/iembot-desktop.desktop" 2>/dev/null || true
              echo "Desktop shortcut created at: $USER_DESKTOP/iembot-desktop.desktop"
          fi

          echo "Installation complete! You can open IEMBot Desktop from your app menu or desktop shortcut."
          EOF

          chmod +x pkg_dir/install.sh

      - name: Generate Self-Extracting .run Installer
        run: |
          makeself pkg_dir iembot-desktop-installer.run "IEMBot Desktop Installer" ./install.sh

      - name: Publish Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: iembot-desktop-installer.run
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
